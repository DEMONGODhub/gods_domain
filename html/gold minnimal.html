<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Gold Price India</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .box {
    background: #020617;
    padding: 20px 28px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    text-align: center;
    min-width: 260px;
  }
  h1 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #facc15;
  }
  .price {
    font-size: 32px;
    font-weight: bold;
    margin: 10px 0;
  }
  .meta {
    font-size: 12px;
    opacity: 0.7;
  }
</style>
</head>

<body>
<div class="box">
  <h1>Gold Price (India)</h1>
  <div class="price" id="price">Loading…</div>
  <div class="meta" id="time"></div>
</div>

<script>
const OZ_TO_GRAM = 31.1035;

async function fetchGold() {
  try {
    const goldRes = await fetch("https://api.metals.live/v1/spot/gold");
    const goldData = await goldRes.json();
    const usdPerOz = goldData[0].price;

    const fxRes = await fetch("https://open.er-api.com/v6/latest/USD");
    const fxData = await fxRes.json();
    const usdToInr = fxData.rates.INR;

    const inrPerGram = (usdPerOz * usdToInr) / OZ_TO_GRAM;

    document.getElementById("price").innerText =
      "₹ " + inrPerGram.toFixed(2) + " / gram";

    document.getElementById("time").innerText =
      "Updated: " + new Date().toLocaleTimeString();

  } catch (e) {
    document.getElementById("price").innerText = "Error loading data";
  }
}

fetchGold();
setInterval(fetchGold, 60000);
</script>
</body>
</html>
