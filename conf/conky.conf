conky.config = {

    -- ─────────────────────────────────────────
    -- POSITION & LAYOUT
    -- ─────────────────────────────────────────
    alignment          = 'bottom_left',   -- where the bar sits: top_left, top_right, bottom_left, bottom_right
    gap_x              = 0,               -- horizontal gap from screen edge (pixels)
    gap_y              = 0,               -- vertical gap from screen edge (pixels)
    minimum_height     = 26,              -- bar height in pixels
    minimum_width      = 1366,            -- set to your screen width
    maximum_width      = 1366,            -- set to your screen width

    -- ─────────────────────────────────────────
    -- WINDOW BEHAVIOUR
    -- ─────────────────────────────────────────
    background         = true,            -- run conky in background (don't block terminal)
    own_window         = true,            -- conky draws its own window
    own_window_class   = 'Conky',
    own_window_type    = 'dock',          -- 'dock' keeps it below other windows; try 'desktop' or 'normal'
    own_window_transparent = false,       -- true = see-through background

    -- ─────────────────────────────────────────
    -- COLOURS & APPEARANCE
    -- ─────────────────────────────────────────
    own_window_colour  = '212121',        -- background colour (dark grey). change to any hex e.g. '000000' for black
    own_window_argb_visual = true,        -- enable alpha (transparency) support
    own_window_argb_value  = 255,         -- 0 = fully transparent, 255 = fully opaque
    default_color      = 'white',         -- default text colour
    default_outline_color = 'white',
    default_shade_color   = 'white',

    -- ─────────────────────────────────────────
    -- FONT
    -- ─────────────────────────────────────────
    font               = 'DejaVu Sans Mono:size=8',  -- monospace keeps columns aligned; change size here
    use_xft            = true,            -- enable anti-aliased fonts (keep true)
    uppercase          = false,           -- true = ALL CAPS text

    -- ─────────────────────────────────────────
    -- PERFORMANCE / SAMPLING
    -- ─────────────────────────────────────────
    update_interval    = 1.0,            -- how often conky refreshes (seconds). lower = smoother but more CPU
    cpu_avg_samples    = 4,              -- number of samples to average for CPU % (higher = smoother)
    net_avg_samples    = 2,              -- number of samples to average for network speed
    no_buffers         = true,           -- exclude disk buffers from RAM usage calculation
    double_buffer      = true,           -- prevents flickering (keep true)

    -- ─────────────────────────────────────────
    -- BORDERS & GRAPHS (all off for clean bar)
    -- ─────────────────────────────────────────
    border_width       = 0,
    draw_borders       = false,
    draw_graph_borders = false,
    draw_outline       = false,
    draw_shades        = false,
    show_graph_range   = false,
    show_graph_scale   = false,
    stippled_borders   = 0,

    -- ─────────────────────────────────────────
    -- OUTPUT (keep all false except out_to_x)
    -- ─────────────────────────────────────────
    out_to_x           = true,
    out_to_console     = false,
    out_to_ncurses     = false,
    out_to_stderr      = false,
    extra_newline      = false,

    use_spacer         = 'none',
}

conky.text = [[
${color white}CPU: ${if_match ${cpu cpu0}<10}0${endif}${cpu cpu0}% ${if_match ${cpu cpu0} >= 90}${color red}${else}${if_match ${cpu cpu0} >= 70}${color yellow}${else}${if_match ${cpu cpu0} >= 40}${color green}${else}${color white}${endif}${endif}${endif}${cpubar 6,140}${color white} | RAM: ${if_match ${memperc}<10}0${endif}${memperc}% ${if_match ${memperc} >= 90}${color red}${else}${if_match ${memperc} >= 70}${color yellow}${else}${if_match ${memperc} >= 40}${color green}${else}${color white}${endif}${endif}${endif}${membar 6,140}${color white} ${mem}/${memmax} | Screen: ${execpi 60 bash /home/demon/screen-color.sh}${color white} | ${alignr}Top CPU:  ${top name 1}  ${if_match ${top cpu 1}<10}0${endif}${top cpu 1}%     ${top name 2}  ${if_match ${top cpu 2}<10}0${endif}${top cpu 2}%
${color white}Core0: ${if_match ${cpu cpu1}<10}0${endif}${cpu cpu1}% ${if_match ${cpu cpu1} >= 90}${color red}${else}${if_match ${cpu cpu1} >= 70}${color yellow}${else}${if_match ${cpu cpu1} >= 40}${color green}${else}${color white}${endif}${endif}${endif}${cpubar cpu1 6,80}${color white}  Core1: ${if_match ${cpu cpu2}<10}0${endif}${cpu cpu2}% ${if_match ${cpu cpu2} >= 90}${color red}${else}${if_match ${cpu cpu2} >= 70}${color yellow}${else}${if_match ${cpu cpu2} >= 40}${color green}${else}${color white}${endif}${endif}${endif}${cpubar cpu2 6,80}${color white} | SWAP: ${if_match ${swapperc}<10}0${endif}${swapperc}% ${if_match ${swapperc} >= 90}${color red}${else}${if_match ${swapperc} >= 70}${color yellow}${else}${if_match ${swapperc} >= 40}${color green}${else}${color white}${endif}${endif}${endif}${swapbar 6,140}${color white} ${swap}/${swapmax} | Temp: ${if_match ${hwmon 2 temp 1} >= 90}${color red}${else}${if_match ${hwmon 2 temp 1} >= 70}${color yellow}${else}${color white}${endif}${endif}${hwmon 2 temp 1}°C${color white} | ↓${downspeed wlp3s0} ↑${upspeed wlp3s0} | ${time %a %d %b %I:%M %p} | ${alignr}Top MEM:  ${top_mem name 1}  ${if_match ${top_mem mem 1}<10}0${endif}${top_mem mem 1}%     ${top_mem name 2}  ${if_match ${top_mem mem 2}<10}0${endif}${top_mem mem 2}%
]]
